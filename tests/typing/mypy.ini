# Strict mypy configuration for the static type tests in this directory.
# Run from the repository root: `mypy --config-file tests/typing/mypy.ini tests/typing`
[mypy]
strict = true
warn_unreachable = true
enable_error_code = ignore-without-code, redundant-expr, truthy-bool
# Read numcodecs from the source tree. It does not ship a py.typed marker yet, so mypy
# would otherwise refuse to analyze the installed copy.
mypy_path = src

# Report errors in the tests only. numcodecs itself is checked by the repository's own
# configuration in pyproject.toml.
[mypy-numcodecs.*]
follow_imports = silent
ignore_errors = true
