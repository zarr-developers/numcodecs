# Strict mypy configuration for the static type tests in this directory.
# Run from the repository root: `mypy --config-file tests/typing/mypy.ini tests/typing`
[mypy]
strict = true
# the oldest supported Python, so names that only exist in newer `typing` modules are caught
python_version = 3.12
warn_unreachable = true
enable_error_code = ignore-without-code, redundant-expr, truthy-bool
# Read numcodecs from the source tree rather than from an installed copy, so the tests
# check the annotations being edited (and work with an editable install, whose import
# hook mypy cannot follow).
mypy_path = src

# Report errors in the tests only. numcodecs itself is checked by the repository's own
# configuration in pyproject.toml.
[mypy-numcodecs.*]
follow_imports = silent
ignore_errors = true
