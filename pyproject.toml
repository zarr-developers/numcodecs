[build-system]
requires = [
    "meson-python>=0.17",
    "meson>=1.6.0",
    "setuptools-scm>=6.2",
    "Cython>=3.1",
    "numpy>=2",
]
build-backend = "mesonpy"

[project]
name = "numcodecs"
description = """
A Python package providing buffer compression and transformation codecs \
for use in data storage and communication applications."""
readme = "README.md"
dependencies = ["numpy>=2.0", "packaging", "typing_extensions>=4.13"]
requires-python = ">=3.12"
dynamic = [
  "version",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
maintainers = [
    { name = "Alistair Miles", email = "alimanfoo@googlemail.com" },
]
license = "MIT"
license-files = [
    "LICENSE.txt",
    "c-blosc/LICENSE.txt",
    "c-blosc/LICENSES/*",
]

[project.urls]
"Bug Tracker" = "https://github.com/zarr-developers/numcodecs/issues"
Changelog = "https://numcodecs.readthedocs.io/en/stable/release.html"
Documentation = "https://numcodecs.readthedocs.io/"
Homepage = "https://github.com/zarr-developers/numcodecs"

[project.optional-dependencies]
msgpack = [
    "msgpack",
]
zfpy = [
    "zfpy>=1.0.1"
]
pcodec = [
    "pcodec>=1,<2",
]
crc32c = [
    "crc32c>=2.7",
]
google_crc32c = [
    "google-crc32c>=1.5"
]
docs = [
    "sphinx",
    "sphinx-issues",
    "pydata-sphinx-theme",
    "numpydoc",
    "myst-parser",
]
test = [
    "coverage",
    "pytest",
    "pytest-cov",
    "pyzstd"
]
test_extras = [
    "importlib_metadata",
]

[dependency-groups]
dev = [
    "meson-python>=0.17",
    "meson>=1.6.0",
    "ninja",
    "cython>=3.1",
    "setuptools-scm>=6.2",
    "numpy>=2",
    "pytest==9.0.3",
    "pytest-cov",
]
typing = [
    "mypy==2.4.1",
    "pyright==1.1.414",
]
test-zarr-313 = [
    {include-group="dev"},
    "zarr==3.1.3",
    "crc32c",
]
test-zarr-latest = [
    {include-group="dev"},
    "zarr",
    "crc32c",
]
test-zarr-main = [
    {include-group="dev"},
    "zarr @ git+https://github.com/zarr-developers/zarr-python.git@main",
    "crc32c",
]

[tool.codespell]
skip = "./.git,fixture"
ignore-words-list = "ba, compiletime, hist, nd, unparseable"

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "pragma: ${PY_MAJOR_VERSION} no cover",
]

[tool.repo-review]
ignore = ["PY005", "PY007", "PP302", "PP308", "PP309", "GH103", "GH212", "PC111", "PC140", "PC160", "PC170", "PC180", "MY100", "RF103"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=numcodecs --cov-report xml --doctest-modules --doctest-glob=*.pyx"
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
    "IGNORE_EXCEPTION_DETAIL",
]
testpaths = [
    "tests",
]
norecursedirs = [
    ".git",
    ".github",
    ".pytest_cache",
    "adhoc",
    "build",
    "builddir",
    "subprojects",
    "c-blosc",
    "docs",
    "fixture",
    "notebooks",
    "numcodecs.egg-info",
]
log_cli_level = "INFO"
xfail_strict = true
filterwarnings = [
    "error",
    "ignore:As the c extension couldn't be imported:RuntimeWarning", # Ignore warning about pure python google_crc32c (on Python 3.14)
    "ignore:.*align should be passed as Python or NumPy boolean.*:numpy.exceptions.VisibleDeprecationWarning", # Old fixture files trigger numpy-internal dtype(align=0) warning (NumPy 2.4+)
]

[tool.cibuildwheel]
# AVX2 disabled for portable wheels (not all x86_64 CPUs have it)
config-settings = "setup-args=-Davx2=disabled"
# Run the test suite against each built wheel, so the SIMD configuration that ships
# to PyPI is tested. test-sources copies the tests and their data fixtures (looked
# up relative to the working directory) into the temporary directory the tests run
# in; the source tree (src/) is not copied, so numcodecs is imported from the wheel.
test-sources = ["tests", "fixture", "pyproject.toml"]
test-extras = ["test", "test_extras", "msgpack", "crc32c"]
test-command = [
    # on free-threaded builds, check that no extension re-enables the GIL
    "python -c \"import sys, sysconfig, numcodecs; assert not (sysconfig.get_config_var('Py_GIL_DISABLED') and sys._is_gil_enabled())\"",
    "pytest tests -p no:cacheprovider --no-cov",
]

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
config-settings = {setup-args = ["-Davx2=disabled", "-Dsse2=disabled"]}

[tool.ruff]
line-length = 100
extend-exclude = ["c-blosc"]

[tool.ruff.lint]
extend-select = [
    "B",
    "C4",
    "EXE",
    "FA",
    "FLY",
    "FURB",
    "G",
    "I",
    "ISC",
    "LOG",
    "PERF",
    "PGH",
    "PIE",
    "PT",
    "PYI",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "SLOT",
    "TID",
    "TRY",
    "UP",
]
ignore = [
    "FURB101",
    "FURB103",
    "PT001",
    "PT011",
    "PT012",
    "PT031",
    "RET505",
    "RET506",
    "SIM108",
    "TRY003",
    "TRY301",
    "UP007",
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["SIM201", "SIM202", "SIM300", "TRY002"]
"notebooks/**" = ["W391"]  # https://github.com/astral-sh/ruff/issues/13763

[tool.ruff.format]
quote-style = "preserve"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# Optional dependencies that ship no type information.
[[tool.mypy.overrides]]
module = [
    "msgpack.*",
    "pcodec.*",
    "zfpy.*",
    "crc32c.*",
    "google_crc32c.*",
    "backports.*",
    # build-time and test-only dependencies
    "setuptools_scm.*",
    "importlib_metadata.*",
    # optional: numcodecs.zarr3 forwards to zarr, which is not installed everywhere
    "zarr.*",
]
ignore_missing_imports = true

# The test suite predates type annotations, and many tests pass wrongly typed values on
# purpose to check runtime errors. As before, annotated test functions are checked and
# unannotated ones are not. tests/typing is checked strictly by its own configuration
# (tests/typing/mypy.ini).
[[tool.mypy.overrides]]
module = ["tests.*"]
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[tool.uv]
# meson-python editable installs require build deps (ninja, meson) at runtime for
# auto-rebuild on import. Skip build isolation so the venv's ninja is used.
# The "dev" dependency group provides these build tools. Bootstrap with:
# `uv pip install --group dev` before running
# `uv pip install --no-build-isolation -e ".[test,test_extras,msgpack]"`.
no-build-isolation-package = ["numcodecs"]
conflicts = [
    # Zarr versions conflict with each other
    [
        { group = "test-zarr-313" },
        { group = "test-zarr-latest" },
        { group = "test-zarr-main" }
    ]
]
