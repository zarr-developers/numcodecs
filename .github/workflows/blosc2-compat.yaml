name: c-blosc2 Blosc1 compatibility

on:
  push:
    branches: [main]
    paths: ['packages/c-blosc2-blosc1-compat/**', 'subprojects/**', 'src/numcodecs/blosc.pyx', 'src/numcodecs/_blosc_shim.h']
  pull_request:
    paths: ['packages/c-blosc2-blosc1-compat/**', 'subprojects/**', 'src/numcodecs/blosc.pyx', 'src/numcodecs/_blosc_shim.h']
  schedule:
    - cron: '0 6 * * 1'  # weekly: does the series still apply to upstream c-blosc2 main?
  workflow_dispatch:

jobs:
  wrap-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python packages/c-blosc2-blosc1-compat/tools/sync_wrap.py --check

  forward-compat:
    # c-blosc2 chunks must be readable by C-Blosc 1.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install meson ninja cmake
      - name: Build C-Blosc 1.x
        run: |
          git clone --depth 1 --branch v1.21.6 https://github.com/Blosc/c-blosc.git /tmp/c-blosc
          cmake -S /tmp/c-blosc -B /tmp/b1 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_STATIC=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/b1 -j
      - name: Build the patched c-blosc2 through the wrap
        run: |
          mkdir /tmp/probe && cd /tmp/probe
          ln -s "$GITHUB_WORKSPACE/subprojects" subprojects
          printf "project('probe','c')\nb = dependency('blosc2')\nexecutable('probe', files('p.c'), dependencies: b)\n" > meson.build
          printf '#include <blosc2.h>\nint main(void){return 0;}\n' > p.c
          meson setup b && meson compile -C b
      - name: Run the compatibility check
        run: |
          B=/tmp/probe/b/subprojects
          python packages/c-blosc2-blosc1-compat/tests/run.py \
            --blosc1-include /tmp/c-blosc/blosc --blosc1-lib /tmp/b1/blosc \
            --blosc2-include "$(echo /tmp/probe/subprojects/c-blosc2-*/include)" \
            --blosc2-ldflags "$(echo $B/c-blosc2-*/libblosc2.a) $(echo $B/zstd-*/build/meson/lib/libzstd.a) $(echo $B/lz4-*/build/meson/meson/lib/liblz4.a) $(echo $B/zlib-*/libz.a)"

  rebase:
    # Informational: does the series still apply to upstream main? Fails only on the schedule.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python packages/c-blosc2-blosc1-compat/tools/rebase.py main
