name: Tests on i386

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-i386:
    # GitHub has no 32-bit runners. An x86_64 kernel runs i386 binaries natively,
    # so a 32-bit Alpine container needs no emulation.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0 # required for version resolution

      - name: Build and test in an i386 Alpine container
        run: >
          docker run --rm --platform linux/386
          -v "$PWD:/src" -w /src
          alpine:3.24 sh .github/scripts/test-i386.sh
