name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # Every Python version runs on ubuntu-latest (which also uploads coverage).
        # The other platforms run the oldest supported GIL build and a free-threaded
        # build: failures have almost always hit every platform or one Python
        # version. The wheels cover every version on every platform (see wheel.yaml).
        python-version: ["3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
        platform: [ubuntu-latest]
        include:
          # macos-15-intel is an intel runner, macos-15 is an arm64 runner
          - {platform: ubuntu-22.04-arm, python-version: "3.12"}
          - {platform: ubuntu-22.04-arm, python-version: "3.14t"}
          - {platform: windows-latest, python-version: "3.12"}
          - {platform: windows-latest, python-version: "3.14t"}
          - {platform: macos-15-intel, python-version: "3.12"}
          - {platform: macos-15-intel, python-version: "3.14t"}
          - {platform: macos-15, python-version: "3.12"}
          - {platform: macos-15, python-version: "3.14t"}

    defaults:
      run:
        shell: bash -e {0}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0 # required for version resolution

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install numcodecs
        run: |
          case "${{ matrix.python-version }}" in
            # pcodec, zfpy and google_crc32c do not ship free-threaded wheels yet
            *t) extras="test,test_extras,msgpack,crc32c" ;;
            # pcodec and zfpy do not ship cp315 wheels yet
            3.15) extras="test,test_extras,msgpack,google_crc32c,crc32c" ;;
            *) extras="test,test_extras,msgpack,google_crc32c,crc32c,pcodec,zfpy" ;;
          esac
          python -m pip install -v ".[$extras]"

      - name: List installed packages
        run: python -m pip list

      - name: Run tests
        run: pytest -v

      - uses: codecov/codecov-action@v6
        with:
          # forks have no CODECOV_TOKEN; only fail on upload errors in the upstream repo
          fail_ci_if_error: ${{ github.repository == 'zarr-developers/numcodecs' }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  test-crc32c:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: google-crc32c
            extras: "google_crc32c"
          - name: crc32c
            extras: "crc32c"
          - name: no-crc32c
            extras: ""

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install numcodecs
        run: |
          if [[ -n "${{ matrix.extras }}" ]]; then
            python -m pip install -v ".[${{ matrix.extras }},test]"
          else
            python -m pip install -v ".[test]"
          fi

      - name: List installed packages
        run: python -m pip list

      - name: Run checksum tests
        run: pytest -v tests/test_checksum32.py

      - uses: codecov/codecov-action@v6
        with:
          # forks have no CODECOV_TOKEN; only fail on upload errors in the upstream repo
          fail_ci_if_error: ${{ github.repository == 'zarr-developers/numcodecs' }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  typing:
    # Static types: the repository's own mypy configuration over src and tests, and the
    # strict type tests in tests/typing under both mypy and pyright (see its README).
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0 # required for version resolution

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install numcodecs and the type checkers
        run: |
          python -m pip install --upgrade pip  # --group needs pip >= 25.1
          python -m pip install -v ".[test,msgpack,crc32c]"
          python -m pip install --group typing

      - name: mypy (repository configuration)
        run: mypy --config-file pyproject.toml src tests

      - name: mypy (strict type tests)
        run: mypy --config-file tests/typing/mypy.ini tests/typing

      - name: pyright (strict type tests)
        run: pyright -p tests/typing

  test-zarr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest release numcodecs.zarr3 supports
          - zarr-version: "313"
            zarr-pkg: "zarr==3.1.3"
          # latest release, unpinned so it never goes stale
          - zarr-version: "latest"
            zarr-pkg: "zarr"
          - zarr-version: "main"
            zarr-pkg: "zarr @ git+https://github.com/zarr-developers/zarr-python.git@main"

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0 # required for version resolution

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install numcodecs and Zarr
        run: |
          python -m pip install -v ".[test,test_extras]" "${{ matrix.zarr-pkg }}" crc32c
      - name: List installed packages
        run: python -m pip list

      - name: Run Zarr integration tests
        run: pytest tests/test_zarr3.py tests/test_zarr3_import.py

      - uses: codecov/codecov-action@v6
        with:
          # forks have no CODECOV_TOKEN; only fail on upload errors in the upstream repo
          fail_ci_if_error: ${{ github.repository == 'zarr-developers/numcodecs' }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  # Branch protection requires this job instead of individual matrix entries, so
  # renaming a runner or changing a matrix never leaves a required check unreported.
  tests-complete:
    name: Tests complete
    needs: [build, test-crc32c, typing, test-zarr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check failure
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Success
        run: echo Success!
