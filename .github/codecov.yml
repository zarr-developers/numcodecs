coverage:
  status:
    project:
      default:
        # Compare against the base commit instead of requiring 100%: on this
        # maintenance branch the zarr and crc32c fallback paths are not
        # covered by the jobs that upload coverage.
        target: auto
        threshold: 0.1
    patch:
      default:
        target: 100
comment:
  layout: "diff, files"
  behavior: default
  require_changes: true  # if true: only post the comment if coverage changes
  branches:               # branch names that can post comment
    - "main"
